<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- IP Tools app icon: a 4-hop route (traceroute / AS path) ending in a node that emits ping rings.
       Full-bleed square, no transparency, no text. iOS applies the corner mask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="0.55" stop-color="#1747C9"/>
      <stop offset="1" stop-color="#0A1F66"/>
    </linearGradient>
    <radialGradient id="glow" cx="740" cy="300" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE6FF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#7FE6FF" stop-opacity="0"/>
    </radialGradient>
    <mask id="ringCut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M232 792 L392 560 L600 660 L740 300" fill="none" stroke="#000" stroke-width="108"
            stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- ping rings around the destination -->
  <g mask="url(#ringCut)" fill="none" stroke="#FFFFFF" stroke-width="30">
    <circle cx="740" cy="300" r="146" stroke-opacity="0.95"/>
    <circle cx="740" cy="300" r="232" stroke-opacity="0.60"/>
    <circle cx="740" cy="300" r="318" stroke-opacity="0.30"/>
  </g>

  <!-- route -->
  <path d="M232 792 L392 560 L600 660 L740 300" fill="none" stroke="#FFFFFF" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- hops -->
  <g fill="#FFFFFF">
    <circle cx="232" cy="792" r="48"/>
    <circle cx="392" cy="560" r="44"/>
    <circle cx="600" cy="660" r="44"/>
  </g>
  <g fill="#1747C9">
    <circle cx="232" cy="792" r="18"/>
    <circle cx="392" cy="560" r="16"/>
    <circle cx="600" cy="660" r="16"/>
  </g>

  <!-- destination -->
  <circle cx="740" cy="300" r="82" fill="#FFFFFF"/>
</svg>
