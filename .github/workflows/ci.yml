name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Package tests
        run: scripts/test.sh
      - name: Build iOS app (Simulator)
        run: |
          xcodebuild -project IPTools.xcodeproj -scheme IPTools \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
